<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Jose ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="app">

        <section class="hero">

            <!-- floating decorations -->
            <div class="floating-heart heart-1">♡</div>
            <div class="floating-heart heart-2">♡</div>
            <div class="floating-heart heart-3">♥</div>
            <div class="floating-star star-1">✦</div>
            <div class="floating-star star-2">✧</div>

            <div class="hero-content">

                <div class="tiny-line"></div>

                <p class="small-text">
                    September 28 · Your day
                </p>

                <div class="love-note">
                    <span>♡</span>
                    made for my favorite person
                    <span>♡</span>
                </div>

                <h1>
                    Happy Birthday,
                    <br>
                    <span>Jose</span>
                    <span class="heart">♥</span>
                </h1>

                <p class="subtitle">
                    5,010 miles apart,<br>
                    but somehow you still feel close.
                </p>

                <button id="startButton">
                    <span>Open your surprise</span>
                    <span class="button-heart">♡</span>
                </button>

                <p class="bottom-note">
                    I made this just for you.
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
